name: MAISON Management build validation

on:
  push:
    branches: [main]
    paths:
      - "maison-management/**"
      - ".github/workflows/maison-management-build.yml"
  pull_request:
    paths:
      - "maison-management/**"
      - ".github/workflows/maison-management-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maison-management
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nejcpgkpynzpnoujllrx.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-validation-placeholder
