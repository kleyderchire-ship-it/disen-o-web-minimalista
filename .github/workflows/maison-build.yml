name: MAISON Management build

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "maison-management/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/maison-build.yml"
  pull_request:
    paths:
      - "maison-management/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/maison-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build MAISON Management
        run: pnpm --dir maison-management build
