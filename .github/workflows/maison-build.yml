name: MAISON Management build

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "maison-management/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/maison-build.yml"
  pull_request:
    paths:
      - "maison-management/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/maison-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build MAISON Management
        run: pnpm --dir maison-management build
      - name: Commit updated workspace lockfile
        run: |
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update pnpm workspace lockfile'
            git pull --rebase origin main
            git push
          fi
